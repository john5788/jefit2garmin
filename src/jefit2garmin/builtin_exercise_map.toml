# jefit2garmin built-in exercise map
#
# Garmin exercises for Jefit's built-in exercises (d_ IDs, the same for every Jefit user), so
# new users don't have to map common exercises themselves. Shipped with jefit2garmin and
# updated with each release.
#
# Don't edit this file to change a mapping for yourself: copy the line into [exercises] in your
# own userdata/exercise_map.toml and edit it there. A line in your file always wins over this
# one; delete yours to go back to the built-in mapping.
#
# Lines have the same format as in exercise_map.toml:
#
#   d_000000000002 = { jefit = "Barbell Bench Press", category = "BENCH_PRESS", name = "BARBELL_BENCH_PRESS" }
#
#   d_...      Jefit exercise ID; the number is the one in the exercise's Jefit URL:
#              https://www.jefit.com/my-jefit/exercises/<number>/<name>
#   jefit      Jefit's name for it (a label for people reading this file).
#   category   Garmin exercise category.
#   name       Garmin exercise within that category; "" = the generic exercise of the category.
#              The pair's page in Garmin Connect is
#              https://connect.garmin.com/app/exercises/<category>/<name>
#
# Reference for valid category and name values: Garmin's public exercise list,
#   https://connect.garmin.com/web-data/exercises/Exercises.json
# (JSON: categories -> exercises, with primary and secondary muscles; no login needed). The
# same list, readable, is written to userdata/state/garmin_exercises.md on every run. A few
# entries in it are refused by Garmin when sent; see REJECTED_NAMES in clients/garmin.py.

format_version = 1
map_version = "2026-11-10"

